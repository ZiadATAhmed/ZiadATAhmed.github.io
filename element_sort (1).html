<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Element Sort | 7th Grade Science</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#101520;
  --slab:#1A2130;
  --slab2:#222B3D;
  --line:#303B52;
  --paper:#E9EDF6;
  --dim:#8C97AE;
  --cyan:#46E3C8;
  --alkali:#FF7A45;
  --alkaline:#FFC24B;
  --transition:#E05A8C;
  --nonmetal:#5BD98A;
  --halogen:#7C9CFF;
  --noble:#B57BFF;
  --wrong:#FF5C6C;
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(900px 500px at 12% -10%, #1D2740 0%, transparent 60%),
    radial-gradient(700px 500px at 95% 0%, #241E38 0%, transparent 55%),
    var(--ink);
  color:var(--paper);
  font-family:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
  font-size:17px;line-height:1.6;min-height:100vh;padding-bottom:130px;
}
h1,h2,h3,h4{font-family:"Space Grotesk",system-ui,sans-serif;line-height:1.15;margin:0}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}

/* header */
.topbar{position:sticky;top:0;z-index:40;background:rgba(16,21,32,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:960px;margin:0 auto;padding:11px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-family:"Space Grotesk",sans-serif}
.brand-tile{width:32px;height:32px;border-radius:7px;background:var(--cyan);color:#0B1018;display:grid;place-items:center;font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:16px}
.who{font-size:13px;color:var(--dim);margin-left:2px}
.steps{display:flex;gap:5px;margin-left:auto;flex-wrap:wrap}
.step{width:29px;height:29px;border-radius:6px;border:1px solid var(--line);background:var(--slab);color:var(--dim);font-family:"IBM Plex Mono",monospace;font-size:12px;display:grid;place-items:center;cursor:pointer;transition:.2s}
.step:hover{border-color:var(--cyan);color:var(--cyan)}
.step.done{border-color:rgba(70,227,200,.5);color:var(--cyan)}
.step.now{background:var(--cyan);border-color:var(--cyan);color:#0B1018;font-weight:600}
.saved{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--dim);min-width:74px;text-align:right}
.saved.flash{color:var(--cyan)}

/* shell */
.wrap{max-width:960px;margin:0 auto;padding:26px 20px 0}
.card{background:var(--slab);border:1px solid var(--line);border-radius:var(--r);padding:26px;margin-bottom:18px}
.eyebrow{font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--cyan);margin-bottom:9px}
h1{font-size:clamp(26px,4.6vw,38px);margin-bottom:12px}
h2{font-size:clamp(21px,3.4vw,28px);margin-bottom:12px}
h3{font-size:19px;margin-bottom:8px}
p{margin:0 0 13px}
.lead{font-size:19px;color:#D3DAEA}
.dim{color:var(--dim)}
.small{font-size:14px}
ul,ol{margin:0 0 13px;padding-left:20px}
li{margin-bottom:6px}
.stage{animation:rise .3s ease}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* the directions block */
.todo{
  background:rgba(70,227,200,.08);
  border:1px solid rgba(70,227,200,.35);
  border-left:4px solid var(--cyan);
  border-radius:10px;padding:14px 16px;margin-bottom:20px;
}
.todo .lbl{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--cyan);margin-bottom:6px}
.todo ol{margin:0;padding-left:19px}
.todo li{margin-bottom:4px;font-size:16px}
.todo .one{font-size:16px;margin:0}

/* buttons */
button{font-family:inherit;font-size:16px;cursor:pointer}
.btn{background:var(--cyan);color:#0B1018;border:0;border-radius:10px;padding:13px 26px;font-weight:600;transition:.18s}
.btn:hover{filter:brightness(1.08)}
.btn-ghost{background:transparent;color:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px 20px}
.btn-ghost:hover{border-color:var(--cyan);color:var(--cyan)}
.btn-sm{padding:8px 14px;font-size:14px}
:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
.actionbar{position:fixed;left:0;right:0;bottom:0;z-index:50;background:rgba(16,21,32,.95);backdrop-filter:blur(10px);border-top:1px solid var(--line)}
.actionbar-in{max-width:960px;margin:0 auto;padding:13px 20px;display:flex;align-items:center;gap:12px}
.hint{font-size:14px;color:var(--dim);margin-right:auto;line-height:1.35}

/* inputs */
label{display:block;font-size:14px;color:var(--dim);margin-bottom:6px}
input[type=text],select,textarea{width:100%;background:var(--ink);color:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-family:inherit;font-size:16px}
textarea{min-height:86px;resize:vertical;line-height:1.5}
input:focus,select:focus,textarea:focus{border-color:var(--cyan);outline:none}
.field{margin-bottom:15px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:560px){.row2{grid-template-columns:1fr}}

/* tiles */
.tile{position:relative;background:var(--slab2);border:1px solid var(--line);border-radius:10px;padding:10px 8px 8px;text-align:center;transition:transform .16s,box-shadow .16s,border-color .16s}
.tile .num{position:absolute;top:6px;left:8px;font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--dim)}
.tile .sym{font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:26px;line-height:1.1;margin-top:8px}
.tile .nm{font-size:11px;color:var(--dim)}
.tile .mass{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--dim)}

/* decoder */
.decoder{display:grid;grid-template-columns:225px 1fr;gap:24px;align-items:start}
@media(max-width:660px){.decoder{grid-template-columns:1fr}}
.bigtile{position:relative;aspect-ratio:1/1;border-radius:16px;background:linear-gradient(160deg,#2A3348,#1D2436);border:1px solid var(--line);display:grid;grid-template-rows:auto 1fr auto auto;padding:16px}
.hot{border:1px dashed var(--line);border-radius:8px;cursor:pointer;transition:.2s;padding:2px 6px}
.hot:hover{border-color:var(--cyan);background:rgba(70,227,200,.08)}
.hot.on{border-color:var(--cyan);background:rgba(70,227,200,.16);border-style:solid}
.hot.seen::after{content:"✓";font-size:11px;color:var(--cyan);margin-left:5px;vertical-align:top}
.h-num{font-family:"IBM Plex Mono",monospace;font-size:20px;color:var(--cyan);justify-self:start}
.h-sym{font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:60px;text-align:center;align-self:center}
.h-nm{text-align:center;font-size:17px}
.h-mass{font-family:"IBM Plex Mono",monospace;font-size:15px;color:var(--dim);text-align:center}
.readout{background:var(--ink);border:1px solid var(--line);border-radius:12px;padding:18px;min-height:180px}
.readout h3{color:var(--cyan)}

/* mini table */
.ptable{display:grid;grid-template-columns:repeat(18,1fr);gap:3px;overflow-x:auto;padding-bottom:6px}
.cell{aspect-ratio:1/1;border-radius:4px;background:var(--slab2);border:1px solid transparent;display:grid;place-items:center;font-family:"IBM Plex Mono",monospace;font-size:clamp(7px,1.1vw,12px);cursor:pointer;transition:.12s;color:var(--paper)}
.cell.empty{background:transparent;cursor:default}
.cell:not(.empty):hover{border-color:var(--cyan)}
.cell.lit{background:rgba(70,227,200,.22)}
.cell.pick{background:var(--cyan);color:#0B1018;font-weight:600}
.gridlabels{display:grid;grid-template-columns:repeat(18,1fr);gap:3px;margin-bottom:4px}
.gridlabels span{text-align:center;font-family:"IBM Plex Mono",monospace;font-size:9px;color:var(--dim)}

/* families */
.fam-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:13px}
.fam{background:var(--ink);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:10px;padding:15px;cursor:pointer;transition:.2s}
.fam:hover{border-color:var(--c);transform:translateY(-2px)}
.fam h3{color:var(--c);font-size:17px}
.fam .where{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--dim);margin-bottom:8px}
.fam .body{display:none;font-size:15px;margin-top:10px;border-top:1px solid var(--line);padding-top:10px}
.fam.open .body{display:block}
.fam .tap{font-size:13px;color:var(--dim)}
.fam.open .tap{display:none}
.wordroot{font-family:"IBM Plex Mono",monospace;font-size:13px;color:var(--c);background:rgba(255,255,255,.04);border-radius:6px;padding:6px 9px;display:inline-block;margin-bottom:8px}

/* sort */
.bench{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px;min-height:60px;margin-bottom:20px}
.bench .tile{cursor:pointer}
.bench .tile:hover{border-color:var(--cyan);transform:translateY(-3px)}
.bench .tile.sel{border-color:var(--cyan);box-shadow:0 0 0 2px var(--cyan);transform:translateY(-3px)}
.benchempty{color:var(--dim);font-size:15px;grid-column:1/-1}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.bin{background:var(--ink);border:2px dashed var(--line);border-radius:12px;padding:12px;min-height:126px;transition:.16s;cursor:pointer}
.bin:hover{border-color:var(--c);background:rgba(255,255,255,.03)}
.bin.bad{animation:shake .3s;border-color:var(--wrong)}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.bin h4{margin:0 0 3px;font-size:15px;color:var(--c)}
.bin .binsub{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--dim);margin-bottom:9px}
.bin .drops{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--c);color:#0B1018;border-radius:6px;padding:4px 9px;font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:14px;animation:pop .22s ease}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}

/* checks */
.q{background:var(--ink);border:1px solid var(--line);border-radius:12px;padding:17px;margin-bottom:13px}
.q .qt{font-weight:600;margin-bottom:11px}
.qn{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--dim);margin-right:8px}
.opts{display:grid;gap:8px}
.opt{text-align:left;background:var(--slab2);color:var(--paper);border:1px solid var(--line);border-radius:9px;padding:11px 14px;transition:.15s}
.opt:hover:not(:disabled){border-color:var(--cyan)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--cyan);background:rgba(70,227,200,.16)}
.opt.wrong{border-color:var(--wrong);background:rgba(255,92,108,.14)}
.fb{margin-top:10px;font-size:15px;padding-left:12px;border-left:2px solid var(--cyan);color:#CFD7E8}
.fb.no{border-color:var(--wrong)}

/* match */
.match{display:grid;grid-template-columns:1fr 1fr;gap:13px}
@media(max-width:600px){.match{grid-template-columns:1fr}}
.mcol{display:grid;gap:8px;align-content:start}
.mhead{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-bottom:2px}
.mitem{text-align:left;background:var(--slab2);color:var(--paper);border:1px solid var(--line);border-radius:9px;padding:11px 13px;font-size:15px;transition:.15s}
.mitem:hover:not(:disabled){border-color:var(--cyan)}
.mitem.sel{border-color:var(--cyan);box-shadow:0 0 0 2px var(--cyan)}
.mitem.done{opacity:.38;border-color:var(--cyan);cursor:default}
.mitem.miss{border-color:var(--wrong);animation:shake .3s}

/* skill bars */
.catwrap{margin-top:18px}
.catbar{margin:10px 0}
.catbar .lab{display:flex;justify-content:space-between;font-weight:600;font-size:15px;margin-bottom:4px}
.catbar .track{height:14px;background:var(--slab2);border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.catbar .fill{height:100%;border-radius:8px;transition:width .6s}
.catbar small{color:var(--dim);font-size:13px}

/* misc */
.tag{display:inline-block;font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line);border-radius:20px;padding:3px 11px;color:var(--dim);margin-bottom:13px}
.note{background:rgba(70,227,200,.07);border:1px solid rgba(70,227,200,.3);border-radius:10px;padding:13px 15px;font-size:15px;margin-bottom:15px}
.resume{background:rgba(181,123,255,.1);border:1px solid rgba(181,123,255,.45);border-radius:12px;padding:16px 18px;margin-bottom:18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.hw{background:var(--ink);border:1px solid var(--line);border-radius:12px;padding:22px;margin-bottom:16px}
.hw ol{padding-left:22px;margin:0}
.hw li{margin-bottom:10px}
.scorebox{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.stat{background:var(--ink);border:1px solid var(--line);border-radius:10px;padding:14px 18px;flex:1;min-width:118px}
.stat .n{font-family:"IBM Plex Mono",monospace;font-size:26px;color:var(--cyan)}
.stat .l{font-size:13px;color:var(--dim)}
.status{font-size:15px;padding:12px 14px;border-radius:10px;margin-top:14px;display:none}
.status.ok{display:block;background:rgba(70,227,200,.12);border:1px solid rgba(70,227,200,.4)}
.status.err{display:block;background:rgba(255,92,108,.12);border:1px solid rgba(255,92,108,.4)}
@media print{
  .topbar,.actionbar,.noprint{display:none!important}
  body{background:#fff;color:#000;padding:0}
  .card,.hw{border-color:#999;background:#fff;color:#000}
  .todo{background:#eee;border-color:#666}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-in">
    <div class="brand"><span class="brand-tile">E</span> Element Sort <span class="who" id="who"></span></div>
    <div class="steps" id="steps"></div>
    <div class="saved" id="saved">Not saved</div>
  </div>
</div>

<div class="wrap"><div id="stage"></div></div>

<div class="actionbar">
  <div class="actionbar-in">
    <span class="hint" id="hint"></span>
    <button class="btn-ghost" id="back" style="display:none">Back</button>
    <button class="btn" id="next">Start</button>
  </div>
</div>

<script>
/* ============================================================
   Element Sort. 7th grade science.
   Results post to the linked Google Sheet when a student
   presses Turn in. Change SCRIPT_URL only if you redeploy.
   ============================================================ */
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx82igxE5nZyB3d-7qJu0s8E5gywEhHrc5uuECutT5lx1bhzaZf93tUx6WXG6ifn8bV1A/exec";
const SAVE_KEY = "mrz_element_sort_v3";

/* ---------------- data ---------------- */
const FAMILIES = {
  alkali:{name:"Alkali metals", where:"Group 1 (first column)", color:"var(--alkali)",
    root:"al-qali (Arabic) = \"the ashes\"",
    why:"Old chemists burned plants, soaked the ashes in water, and got a slippery liquid called an alkali. These metals do the same thing: drop one in water and the water turns alkaline.",
    like:"Soft enough to cut with a butter knife. So reactive they are stored under oil so air cannot touch them.",
    meet:"Sodium is half of table salt. Potassium is why bananas are on the poster in the nurse's office."},
  alkaline:{name:"Alkaline earth metals", where:"Group 2 (second column)", color:"var(--alkaline)",
    root:"alkaline + earth = \"a solid that will not melt or dissolve\"",
    why:"They also make water alkaline, but old chemists could not melt them in their furnaces, so they filed them under earths.",
    like:"Harder and less wild than Group 1, but still reactive. Many burn with bright colors.",
    meet:"Calcium is in your bones and in chalk. Magnesium is the blinding white flame in fireworks."},
  transition:{name:"Transition metals", where:"Groups 3 to 12 (wide middle block)", color:"var(--transition)",
    root:"transition = \"crossing over\"",
    why:"They sit in the middle where the table crosses over from the reactive left side to the nonmetal right side.",
    like:"Hard, shiny, high melting points, great at carrying electricity. Their compounds are usually colorful.",
    meet:"Iron in a bridge. Copper in the wire behind your wall. Zinc in the coating that keeps nails from rusting."},
  nonmetal:{name:"Nonmetals", where:"Upper right area", color:"var(--nonmetal)",
    root:"non + metal = \"not a metal\"",
    why:"Named by what they are missing. No shine, no bend, no good at carrying electricity.",
    like:"Dull, brittle as a solid, many are gases at room temperature.",
    meet:"Carbon, nitrogen, and oxygen. Almost everything alive is built mostly from these three plus hydrogen."},
  halogen:{name:"Halogens", where:"Group 17 (second from the right)", color:"var(--halogen)",
    root:"hals (Greek) = \"salt\" + genes = \"maker\"",
    why:"Literally salt makers. Hand a halogen to an alkali metal and you get a salt. Sodium plus chlorine gives you the salt on your fries.",
    like:"The most reactive nonmetals. Colorful and dangerous alone, harmless once bonded.",
    meet:"Fluorine is in toothpaste. Chlorine keeps pools clean. Iodine is added to table salt on purpose."},
  noble:{name:"Noble gases", where:"Group 18 (last column)", color:"var(--noble)",
    root:"noble = \"royal, above mixing with commoners\"",
    why:"Chemists named them after nobility because they refuse to react with anything. They are already full and happy.",
    like:"Invisible, odorless, almost never form compounds. Glow bright colors when electricity runs through them.",
    meet:"Helium in balloons. Neon in the sign outside a taco shop. Argon inside double pane windows."}
};

const SORTSET = [
  {n:3,s:"Li",e:"Lithium",m:"6.94",f:"alkali"},
  {n:11,s:"Na",e:"Sodium",m:"22.99",f:"alkali"},
  {n:19,s:"K",e:"Potassium",m:"39.10",f:"alkali"},
  {n:4,s:"Be",e:"Beryllium",m:"9.01",f:"alkaline"},
  {n:12,s:"Mg",e:"Magnesium",m:"24.31",f:"alkaline"},
  {n:20,s:"Ca",e:"Calcium",m:"40.08",f:"alkaline"},
  {n:26,s:"Fe",e:"Iron",m:"55.85",f:"transition"},
  {n:29,s:"Cu",e:"Copper",m:"63.55",f:"transition"},
  {n:30,s:"Zn",e:"Zinc",m:"65.38",f:"transition"},
  {n:6,s:"C",e:"Carbon",m:"12.01",f:"nonmetal"},
  {n:7,s:"N",e:"Nitrogen",m:"14.01",f:"nonmetal"},
  {n:8,s:"O",e:"Oxygen",m:"16.00",f:"nonmetal"},
  {n:9,s:"F",e:"Fluorine",m:"19.00",f:"halogen"},
  {n:17,s:"Cl",e:"Chlorine",m:"35.45",f:"halogen"},
  {n:53,s:"I",e:"Iodine",m:"126.90",f:"halogen"},
  {n:2,s:"He",e:"Helium",m:"4.00",f:"noble"},
  {n:10,s:"Ne",e:"Neon",m:"20.18",f:"noble"},
  {n:18,s:"Ar",e:"Argon",m:"39.95",f:"noble"}
];

const PT = [
 [1,1,"H","Hydrogen"],[1,18,"He","Helium"],
 [2,1,"Li","Lithium"],[2,2,"Be","Beryllium"],[2,13,"B","Boron"],[2,14,"C","Carbon"],[2,15,"N","Nitrogen"],[2,16,"O","Oxygen"],[2,17,"F","Fluorine"],[2,18,"Ne","Neon"],
 [3,1,"Na","Sodium"],[3,2,"Mg","Magnesium"],[3,13,"Al","Aluminum"],[3,14,"Si","Silicon"],[3,15,"P","Phosphorus"],[3,16,"S","Sulfur"],[3,17,"Cl","Chlorine"],[3,18,"Ar","Argon"],
 [4,1,"K","Potassium"],[4,2,"Ca","Calcium"],[4,3,"Sc","Scandium"],[4,4,"Ti","Titanium"],[4,5,"V","Vanadium"],[4,6,"Cr","Chromium"],[4,7,"Mn","Manganese"],[4,8,"Fe","Iron"],[4,9,"Co","Cobalt"],[4,10,"Ni","Nickel"],[4,11,"Cu","Copper"],[4,12,"Zn","Zinc"],[4,13,"Ga","Gallium"],[4,14,"Ge","Germanium"],[4,15,"As","Arsenic"],[4,16,"Se","Selenium"],[4,17,"Br","Bromine"],[4,18,"Kr","Krypton"]
];

const VOCAB = [
  ["Element","A pure substance made of only one kind of atom. It cannot be broken into anything simpler."],
  ["Atomic number","The number of protons in one atom. It is the element's ID number and no two elements share one."],
  ["Chemical symbol","The one or two letter shorthand for an element. First letter capital, second letter lowercase."],
  ["Atomic mass","How heavy one atom is on average, counting protons and neutrons together."],
  ["Group","A column running top to bottom. Elements in the same column behave in similar ways."],
  ["Period","A row running left to right. Atomic number climbs by one with every step to the right."],
  ["Family","Another word for a group, used when the column has a nickname like halogens."],
  ["Metalloid","An in between element along the staircase. Part metal, part nonmetal, which makes it useful in computer chips."]
];

/* Every question carries a fixed id so the spreadsheet column
   never moves, even though display order is shuffled. */
const CHECKS = {
  basics:[
    {id:"basics_1", q:"What makes one element different from another?",
     opts:[["The color it is",0],["How many protons its atoms have",1],["How heavy the sample is",0],["Where it was mined",0]],
     why:"Proton count is the whole story. Same protons means same element, no matter what it looks like."},
    {id:"basics_2", q:"Is water an element?",
     opts:[["Yes, it is pure",0],["No, it is two kinds of atom joined together",1],["Only when it is frozen",0],["Only when it is clean",0]],
     why:"Water is hydrogen plus oxygen. An element is one kind of atom only."}
  ],
  tile:[
    {id:"tile_1", q:"An element square shows 11 in the top left corner. What does 11 tell you?",

/* ---------------- save and load ---------------- */
let storageOK = true;
try{ localStorage.setItem("__t","1"); localStorage.removeItem("__t"); }catch(e){ storageOK = false; }

function save(){
  if(!storageOK) return;
  try{
    localStorage.setItem(SAVE_KEY, JSON.stringify(S));
    const el = $("saved");
    el.textContent = "Saved";
    el.classList.add("flash");
    clearTimeout(save._t);
    save._t = setTimeout(()=>el.classList.remove("flash"),900);
  }catch(e){ storageOK = false; }
}
function load(){
  if(!storageOK) return null;
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return null;
    const d = JSON.parse(raw);
    if(d && d.v===3 && d.name) return d;
  }catch(e){}
  return null;
}
function wipe(){
  if(storageOK){ try{ localStorage.removeItem(SAVE_KEY); }catch(e){} }
}

/* count time only while the tab is actually open and being used */
setInterval(()=>{ if(S.name && !S.sent && !document.hidden){ S.seconds++; } },1000);
setInterval(()=>{ if(S.name && !S.sent) save(); },10000);
window.addEventListener("beforeunload", ()=>{ if(S.name && !S.sent) save(); });

/* ---------------- helpers ---------------- */
function shuffle(arr){
  const a = [...arr];
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function drawSteps(){
  $("steps").innerHTML = STAGES.map((_,i)=>
    `<div class="step ${i<S.idx?"done":""} ${i===S.idx?"now":""}" data-i="${i}" title="Step ${i+1}">${String(i+1).padStart(2,"0")}</div>`
  ).join("");
  $("steps").querySelectorAll(".step").forEach(b=>{
    b.onclick = ()=>{ if(S.name) go(+b.dataset.i); };
  });
  $("who").textContent = S.name ? [S.name,S.teacher,S.period].filter(Boolean).join(" / ") : "";
}

function go(n){
  S.idx = Math.max(0, Math.min(STAGES.length-1, n));
  drawSteps();
  backBtn.style.display = S.idx>0 ? "" : "none";
  nextBtn.textContent = S.idx===STAGES.length-1 ? "Turn in" : "Next";
  nextBtn.disabled = false;
  window.scrollTo({top:0,behavior:"smooth"});
  RENDER[STAGES[S.idx]]();
  save();
}

nextBtn.onclick = ()=>{
  if(S.idx===STAGES.length-1){ submit(); return; }
  go(S.idx+1);
};
backBtn.onclick = ()=>go(S.idx-1);

/* directions block */
function todo(lines){
  if(lines.length===1) return `<div class="todo"><div class="lbl">What to do on this screen</div><p class="one">${lines[0]}</p></div>`;
  return `<div class="todo"><div class="lbl">What to do on this screen</div><ol>${lines.map(l=>`<li>${l}</li>`).join("")}</ol></div>`;
}

/* check questions, shuffled every time they render */
function checkBlock(setName){
  const qs = shuffle(CHECKS[setName]);
  const host = document.createElement("div");
  host.innerHTML = qs.map((q,i)=>{
    const opts = shuffle(q.opts);
    return `<div class="q" data-qi="${i}">
      <div class="qt"><span class="qn">Q${i+1}</span>${q.q}</div>
      <div class="opts">${opts.map((o,j)=>
        `<button class="opt" data-qi="${i}" data-ok="${o[1]}">${esc(o[0])}</button>`).join("")}</div>
      <div class="fb" style="display:none"></div>
    </div>`;
  }).join("");

  host.querySelectorAll(".opt").forEach(b=>{
    b.onclick = ()=>{
      const qi = +b.dataset.qi, q = qs[qi];
      const box = host.querySelectorAll(".q")[qi];
      box.querySelectorAll(".opt").forEach(x=>{
        x.disabled = true;
        if(x.dataset.ok==="1") x.classList.add("right");
      });
      const right = b.dataset.ok==="1";
      if(!right) b.classList.add("wrong");
      const fb = box.querySelector(".fb");
      fb.style.display = "block";
      fb.className = "fb" + (right?"":" no");
      fb.textContent = (right ? "Correct. " : "Not quite. ") + q.why;
      // keep the first answer only, so going back does not overwrite it
      if(!(q.id in S.checks)) S.checks[q.id] = right ? "correct" : "incorrect";
      save();
    };
  });
  return host;
}

RENDER.sort = ()=>{
  const placed = new Set(S.placed);
  const bins = Object.entries(FAMILIES).map(([k,f])=>{
    const chips = SORTSET.filter(e=>e.f===k && placed.has(e.n))
      .map(e=>`<span class="chip">${e.s}</span>`).join("");
    return `<div class="bin" data-f="${k}" style="--c:${f.color}">
      <h4>${f.name}</h4>
      <div class="binsub">${f.where}</div>
      <div class="drops" id="drop-${k}">${chips}</div>
    </div>`;
  }).join("");
  const left = SORTSET.filter(e=>!placed.has(e.n));
  const tiles = left.length
    ? shuffle(left).map(el=>`
      <div class="tile" data-n="${el.n}">
        <div class="num mono">${el.n}</div>
        <div class="sym">${el.s}</div>
        <div class="nm">${el.e}</div>
        <div class="mass">${el.m}</div>
      </div>`).join("")
    : `<div class="benchempty">All 18 sorted. Look at the families you built, then press Next.</div>`;

  stage.innerHTML = `
  <div class="stage card">
    <div class="eyebrow">Screen 5 of 8 / the main activity</div>
    <h2>Sort all 18 elements into their families</h2>
    ${todo([
      "<strong>Tap one element tile</strong> in the top row. It gets a bright outline, which means you picked it up.",
      "<strong>Tap the family box</strong> below where you think it belongs.",
      "Right answers snap into the box. Wrong answers shake and give you a hint, then you try again.",
      "Keep going until the top row is empty. There are 18."
    ])}
    <p class="small dim">Stuck on one? Use the atomic number and think about what you read on the last screen. Scroll up to the step numbers and tap 04 anytime to reread the families.</p>
    <h3 style="margin:18px 0 8px">Elements to sort <span class="dim mono" id="leftct" style="font-size:14px">(${left.length} left)</span></h3>
    <div class="bench" id="bench">${tiles}</div>
    <h3 style="margin:0 0 8px">Drop them here</h3>
    <div class="bins">${bins}</div>
    <div class="note" id="sortfb" style="display:none"></div>
  </div>`;

  let sel = null;
  const bench = $("bench");
  const wire = ()=>{
    bench.querySelectorAll(".tile").forEach(t=>{
      t.onclick = ()=>{
        bench.querySelectorAll(".tile").forEach(x=>x.classList.remove("sel"));
        t.classList.add("sel"); sel = t;
        hint.innerHTML = "Picked up. Now tap the family box it belongs in.";
      };
    });
  };
  wire();

  stage.querySelectorAll(".bin").forEach(b=>{
    b.onclick = ()=>{
      if(!sel){ hint.innerHTML = "Tap an element tile first, then tap a family box."; return; }
      const el = SORTSET.find(x=>x.n===+sel.dataset.n);
      const fb = $("sortfb");
      fb.style.display = "block";
      if(b.dataset.f === el.f){
        if(!el._missed) S.sortFirstTry++;
        S.placed.push(el.n);
        $("drop-"+el.f).insertAdjacentHTML("beforeend",`<span class="chip">${el.s}</span>`);
        sel.remove(); sel = null;
        const remaining = 18 - S.placed.length;
        $("leftct").textContent = `(${remaining} left)`;
        fb.innerHTML = `<strong>${el.e}</strong> is in the ${FAMILIES[el.f].name.toLowerCase()}. ${FAMILIES[el.f].meet}`;
        if(remaining===0){
          bench.innerHTML = `<div class="benchempty">All 18 sorted. Look at the families you built, then press Next.</div>`;
          fb.innerHTML = "<strong>Done.</strong> Every element is home. Notice how each box holds elements that act alike.";
          hint.innerHTML = "All 18 sorted. Press Next.";
        } else {
          hint.innerHTML = `${remaining} to go. Tap the next element tile.`;
        }
        save();
      } else {
        if(!el._missed){ el._missed = true; S.sortMisses++; }
        b.classList.add("bad");
        setTimeout(()=>b.classList.remove("bad"),320);
        fb.innerHTML = `Not that box. Hint for <strong>${el.e}</strong>: ${hintFor(el)} Tap a different family box.`;
        save();
      }
    };
  });
  hint.innerHTML = "Tap an element, then tap the family box it belongs in.";
};

function hintFor(el){
  return ({
    alkali:"it lives in the very first column and it turns water alkaline",
    alkaline:"second column. Think bones, chalk, and bright fireworks",
    transition:"it is a hard shiny metal from the wide middle block",
    nonmetal:"living things are built out of it and it is no metal at all",
    halogen:"pair it with sodium and you get a salt",
    noble:"it refuses to react with anything and it might glow inside a sign"
  })[el.f] + ".";
}

      }</div>
    </div>
    <p class="small dim" style="margin-top:14px" id="mcount">${done.size} of 8 matched</p>
  </div>`;

  let pick = null;
  stage.querySelectorAll("#mt .mitem").forEach(b=>{
    b.onclick = ()=>{
      stage.querySelectorAll("#mt .mitem").forEach(x=>x.classList.remove("sel"));
      b.classList.add("sel"); pick = b;
      hint.innerHTML = "Now tap the meaning on the right.";
    };
  });
  stage.querySelectorAll("#md .mitem").forEach(b=>{
    b.onclick = ()=>{
      if(!pick){ hint.innerHTML = "Tap a word on the left first."; return; }
      if(pick.dataset.t === b.dataset.t){
        pick.classList.add("done"); pick.classList.remove("sel"); pick.disabled = true;
        b.classList.add("done"); b.disabled = true;
        S.matched.push(pick.dataset.t);
        pick = null;
        const n = S.matched.length;
        $("mcount").textContent = n+" of 8 matched";
        hint.innerHTML = n>=8 ? "All 8 matched. Press Next." : `${8-n} pairs left.`;
        save();
      } else {
        S.vocabMisses++;
        b.classList.add("miss");
        setTimeout(()=>b.classList.remove("miss"),320);
        hint.innerHTML = "Not that one. Your word is still selected, try another meaning.";
        save();
      }
    };
  });
  hint.innerHTML = "Tap a word, then tap its meaning.";
};

/* ---------------- scoring ---------------- */
function catScores(){
  const vals = Object.values(S.checks);
  const checkTotal = vals.length;
  const checkRight = vals.filter(v=>v==="correct").length;
  const checkPct = checkTotal ? Math.round(checkRight/checkTotal*100) : 0;
  const sortPct = Math.round(S.sortFirstTry/18*100);
  const vocabAttempts = S.matched.length + S.vocabMisses;
  const vocabPct = vocabAttempts ? Math.round(S.matched.length/vocabAttempts*100) : 0;
  return {checkRight, checkTotal, checkPct, sortPct, vocabPct};
}
function catBars(){
  const c = catScores();
  const rows = [
    ["Check questions", c.checkPct, "reading tiles, rows, and columns"],
    ["Element sort", c.sortPct, "placing elements in the right family"],
    ["Vocabulary", c.vocabPct, "matching the words to their meanings"]
  ];
  const bars = rows.map(([t,a,d])=>{
    const col = a>=80 ? "#5BD98A" : a>=60 ? "#FFC24B" : "#FF7A7A";
    return `<div class="catbar">
      <div class="lab"><span>${t}</span><span style="color:${col}">${a}%</span></div>
      <div class="track"><div class="fill" style="width:${a}%;background:${col}"></div></div>
      <small>${d}</small>
    </div>`;
  }).join("");
  return `<div class="catwrap"><h3 style="margin:0 0 6px;font-size:17px">How you did in each skill</h3>${bars}
    <p class="small dim" style="margin-top:8px">The lowest bar is the skill to review before the quiz.</p></div>`;
}

/* ---------------- submit ---------------- */
function payload(){
  const c = catScores();
  return {
    timestamp:new Date().toISOString(),
    submittedAt:new Date().toLocaleString(),
    name:S.name,
    teacher:S.teacher,
    classPeriod:S.period,
    minutesSpent:Math.round(S.seconds/60*10)/10,
    sortedFirstTry:S.sortFirstTry,
    sortMisses:S.sortMisses,
    sortAccuracyPct:c.sortPct,
    vocabMatched:S.matched.length,
    vocabMisses:S.vocabMisses,
    vocabAccuracyPct:c.vocabPct,
    checkCorrect:c.checkRight,
    checkTotal:c.checkTotal,
    checkQuestionsPct:c.checkPct,
    checkBasics1:S.checks.basics_1||"", checkBasics2:S.checks.basics_2||"",
    checkTile1:S.checks.tile_1||"", checkTile2:S.checks.tile_2||"", checkTile3:S.checks.tile_3||"",
    checkGrid1:S.checks.grid_1||"", checkGrid2:S.checks.grid_2||"",
    exit1_atomicNumber:S.exit.q1,
    exit2_nobleGases:S.exit.q2,
    exit3_elementInLife:S.exit.q3
  };
}
function download(){
  const txt = Object.entries(payload()).map(([k,v])=>k+": "+v).join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([txt],{type:"text/plain"}));
  a.download = "ElementSort_"+(S.name||"student").replace(/\s+/g,"_")+".txt";
  a.click();
}
async function submit(){
  const st = $("status");
  if(!S.name.trim()){
    st.className = "status err";
    st.innerHTML = "<strong>No name on this.</strong> Tap step 01 up top and enter your name first.";
    return;
  }
  nextBtn.disabled = true;
  nextBtn.textContent = "Sending...";
  st.className = "status ok";
  st.textContent = "Sending your work to "+(S.teacher||"your teacher")+"...";
  try{
    await fetch(SCRIPT_URL,{
      method:"POST", mode:"no-cors",
      headers:{"Content-Type":"text/plain;charset=utf-8"},
      body:JSON.stringify(payload())
    });
    S.sent = true;
    save();
    st.className = "status ok";
    st.innerHTML = "<strong>Turned in.</strong> "+esc(S.name)+", your work is with "+esc(S.teacher||"your teacher")+". You can close this tab. The homework is above if you want to print it.";
    nextBtn.textContent = "Turned in";
    hint.innerHTML = "All done. You can close this tab.";
  }catch(e){
    st.className = "status err";
    st.innerHTML = "<strong>That did not send.</strong> Press the download button below, then upload the file to the Classroom assignment.";
    $("backup").style.display = "";
    nextBtn.textContent = "Try again";
    nextBtn.disabled = false;
  }
}

/* ---------------- boot ---------------- */
go(0);
