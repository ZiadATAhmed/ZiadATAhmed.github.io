<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Carbon Garden</title>
<style>
:root{
  --bg:#f4eee1; --card:#fffdf8; --ink:#2b2924; --muted:#6c6457; --line:#e1d6c0;
  --leaf:#3d8b4a; --leaf-d:#2a6834; --leaf-l:#e1f1dc;
  --sun:#f0b429; --sun-l:#fdf1cc; --soil:#8b5d3d;
  --red:#c9473a; --red-l:#fbe2dd; --blue:#3a76b0; --blue-l:#ddebf7; --tag:#e59a00;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:17px;line-height:1.5}
button,select,input{font-family:inherit}
.bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;justify-content:space-between;padding:9px 18px;background:var(--leaf-d);color:#fff;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:20px}
.who{font-size:15px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.pill{background:rgba(255,255,255,.17);padding:3px 11px;border-radius:999px;white-space:nowrap}
main{max-width:1080px;margin:0 auto;padding:14px 16px 70px}
h1{font-size:32px;margin:6px 0 4px}
h2{font-size:23px;margin:2px 0 4px}
h3{font-size:19px;margin:4px 0}
p{margin:6px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 20px;margin:14px 0;box-shadow:0 2px 0 rgba(60,40,10,.05)}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--leaf);color:#fff;border:0;border-radius:11px;padding:11px 20px;font-size:16.5px;font-weight:700;cursor:pointer;box-shadow:0 3px 0 var(--leaf-d);transition:transform .08s}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--leaf-d)}
.btn:disabled{background:#bdb6a8;box-shadow:0 3px 0 #9d9688;cursor:not-allowed;filter:none}
.btn.alt{background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:0 3px 0 var(--line)}
.btn.sun{background:var(--sun);color:#3b2a00;box-shadow:0 3px 0 #b9860f}
.btn.small{padding:6px 12px;font-size:14.5px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end;margin-top:12px}
.muted{color:var(--muted)}
.small{font-size:14px}
.center{text-align:center}

/* guide */
.guide{display:flex;gap:12px;align-items:flex-start;margin:14px 0}
.ava{flex:0 0 52px;height:52px;border-radius:50%;background:var(--leaf-l);display:grid;place-items:center;border:2px solid var(--leaf)}
.bubble{background:var(--card);border:1px solid var(--line);border-radius:4px 14px 14px 14px;padding:12px 16px;flex:1}

/* questions */
.qtext{font-weight:700;font-size:18px;margin:0 0 8px}
.opt{display:block;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:10px;padding:10px 14px;margin:8px 0;font-size:16.5px;cursor:pointer;color:var(--ink)}
.opt:hover:not(:disabled){border-color:var(--leaf)}
.opt.right{background:var(--leaf-l);border-color:var(--leaf);font-weight:600}
.opt.wrong{background:var(--red-l);border-color:var(--red);opacity:.85}
.opt.chosen{background:var(--blue-l);border-color:var(--blue);font-weight:600}
.opt:disabled{cursor:default}
.fb{margin-top:8px;padding:10px 13px;border-radius:10px}
.fb.good{background:var(--leaf-l)}
.fb.bad{background:var(--red-l)}
.fb.info{background:var(--sun-l)}
.pts{display:inline-block;background:var(--sun);color:#3b2a00;font-weight:800;border-radius:999px;padding:0 9px;margin-left:6px;font-size:14px}
.tag{display:inline-block;background:var(--blue-l);color:var(--blue);font-weight:700;font-size:13px;border-radius:999px;padding:2px 10px;margin-bottom:6px}

/* sorting + ordering */
.tray{display:flex;flex-wrap:wrap;gap:8px;min-height:48px;padding:10px;border:2px dashed var(--line);border-radius:12px;margin:8px 0 12px;background:#fbf8f1}
.chip{background:#fff;border:2px solid var(--line);border-radius:10px;padding:8px 12px;font-size:15.5px;cursor:pointer;text-align:left;color:var(--ink)}
.chip:hover{border-color:var(--blue)}
.chip.sel{border-color:var(--blue);background:var(--blue-l);box-shadow:0 0 0 3px rgba(58,118,176,.25)}
.chip.placed{border-color:var(--leaf);background:var(--leaf-l);cursor:default;font-size:14px}
.chip.placed.late{border-color:#d29b2c;background:var(--sun-l)}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.bin{border:2px solid var(--line);border-radius:12px;padding:10px;min-height:110px;background:#fbf8f1;cursor:pointer;transition:background .15s}
.bin.ready{border-color:var(--blue);background:#f1f6fc}
.binh{font-weight:800}
.binsub{font-size:13px;color:var(--muted)}
.binbody{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.slots{list-style:none;padding:0;margin:6px 0;display:flex;flex-direction:column;gap:6px}
.slot{display:flex;gap:10px;align-items:center;border:2px dashed var(--line);border-radius:10px;padding:7px 10px;background:#fff}
.slot.filled{border-style:solid;border-color:var(--leaf);background:var(--leaf-l)}
.sn{flex:0 0 28px;height:28px;border-radius:50%;background:var(--leaf-d);color:#fff;display:grid;place-items:center;font-weight:800;font-size:14px}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.shake{animation:shake .25s 2}

/* equations */
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:14.5px;margin:4px 0 10px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.ld{width:15px;height:15px;border-radius:50%;border:1.2px solid #333;display:inline-block}
.eq{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px;padding:12px;background:#fbf8f1;border-radius:12px;border:1px solid var(--line)}
.term{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px;border-radius:10px;background:#fff;border:1px solid var(--line);min-width:96px}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:36px;height:36px;border-radius:9px;border:2px solid var(--line);background:#fff;font-size:20px;font-weight:800;cursor:pointer;color:var(--ink)}
.stepper button:hover{border-color:var(--leaf)}
.coef{font-size:26px;font-weight:800;min-width:30px;text-align:center}
.coef.fixed{color:var(--muted)}
.pics{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:2px;max-width:180px;min-height:36px}
.flab{font-weight:800;font-size:19px}
.arrow{font-size:30px;font-weight:800;color:var(--leaf-d);text-align:center;line-height:1}
.arrow small{display:block;font-size:12px;font-weight:700;color:#b07d00}
.plus{font-size:26px;font-weight:800;color:var(--muted)}
.energy{background:var(--sun-l);border:2px solid var(--sun);border-radius:10px;padding:8px 10px;font-weight:800;color:#7a5600}
.tally{border-collapse:collapse;margin:12px auto;font-size:16px}
.tally td,.tally th{border:1px solid var(--line);padding:6px 14px;text-align:center;background:#fff}
.tally th{background:#f6f1e5}
.ok{color:var(--leaf-d);font-weight:800}
.no{color:var(--red);font-weight:800}
.audit input{width:64px;font-size:20px;text-align:center;padding:4px;border-radius:8px;border:2px solid var(--line)}
.audit input.good{border-color:var(--leaf);background:var(--leaf-l)}
.audit input.bad{border-color:var(--red);background:var(--red-l)}
.bigeq{font-size:22px;font-weight:800;text-align:center;padding:10px;background:var(--leaf-l);border-radius:12px;margin:8px 0}

/* hub */
.gsvg{width:100%;height:auto;display:block;border-radius:12px}
.gcap{text-align:center;font-weight:700;margin-top:8px}
.stages{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.scard{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.scard.locked{opacity:.5}
.sic{font-size:30px;line-height:1;flex:0 0 40px;text-align:center}
.scard h3{margin:0}
.status{font-size:13px;font-weight:700;border-radius:999px;padding:2px 9px;display:inline-block;margin:4px 0}
.st-done{background:var(--leaf-l);color:var(--leaf-d)}
.st-go{background:var(--sun-l);color:#7a5600}
.st-lock{background:#eee;color:#888}
.shead{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.dots{display:flex;gap:6px;margin-left:auto}
.d{width:13px;height:13px;border-radius:50%;background:#ddd3bf}
.d.done{background:var(--leaf)}
.d.now{background:var(--sun);box-shadow:0 0 0 3px rgba(240,180,41,.3)}
.form label{display:block;font-weight:700;margin:10px 0 4px}
.form input,.form select{font-size:18px;padding:8px 10px;border-radius:9px;border:2px solid var(--line);width:100%;max-width:340px}

/* jar sim */
.jarwrap{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start}
.jar{width:220px;height:auto}
.jarside{flex:1;min-width:260px}
.seg{display:inline-flex;border:2px solid var(--line);border-radius:10px;overflow:hidden;margin:4px 0 10px}
.seg button{border:0;background:#fff;padding:7px 13px;font-size:15px;cursor:pointer;border-right:1px solid var(--line);color:var(--ink)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--leaf);color:#fff;font-weight:700}
.meter{font-size:18px;margin-top:10px}
.chart{width:100%;height:auto;margin-top:10px}
.todo{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.todo span{border:2px solid var(--line);border-radius:999px;padding:3px 11px;font-size:14px;background:#fff}
.todo span.yes{border-color:var(--leaf);background:var(--leaf-l);font-weight:700}
.log{margin:6px 0;padding-left:20px;font-size:15px}

/* labs */
.lab{display:grid;grid-template-columns:1fr 150px 1fr;gap:10px;align-items:center;margin-top:12px;min-height:200px}
.lab .col{background:#fbf8f1;border:1px solid var(--line);border-radius:12px;padding:10px;min-height:190px}
.lab .col h4{margin:0 0 6px;font-size:15px}
.fade{transition:opacity .7s, transform .7s}
.gone{opacity:.35;transform:translateX(20px)}
.det{margin-top:8px;font-size:14.5px}
.detbar{height:12px;background:#eee;border-radius:6px;overflow:hidden;margin-top:3px}
.detbar i{display:block;height:100%;width:0;background:var(--tag);transition:width .8s}
.leafglow{filter:drop-shadow(0 0 10px #ffd84d)}
.results{margin-top:10px}
.results table{border-collapse:collapse;width:100%;font-size:15px}
.results td,.results th{border:1px solid var(--line);padding:6px 10px;background:#fff;text-align:left}
.scene{width:100%;height:auto;border-radius:12px;display:block}
.scene .hot{filter:drop-shadow(0 0 4px #ffae00) drop-shadow(0 0 9px #ffae00)}
.beep{font-weight:800;color:#a46a00}
.iso{display:flex;gap:30px;justify-content:center;flex-wrap:wrap;text-align:center}

/* seeds */
.designs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:10px}
.design{border:2px solid var(--line);background:#fff;border-radius:12px;padding:8px;cursor:pointer;text-align:center;color:var(--ink)}
.design:hover:not(:disabled){border-color:var(--blue)}
.design.on{border-color:var(--blue);background:var(--blue-l)}
.design b{display:block;font-size:15px}
.design span{font-size:13px;color:var(--muted)}
.envsvg{width:100%;height:auto;border-radius:12px;display:block;margin-top:8px}
.bars{margin-top:8px}
.brow{display:grid;grid-template-columns:150px 1fr 70px;gap:8px;align-items:center;font-size:14.5px;margin:3px 0}
.brow .bt{height:14px;background:#eee;border-radius:7px;overflow:hidden}
.brow .bt i{display:block;height:100%;background:var(--leaf)}
.brow.me{font-weight:800}
.brow.me .bt i{background:var(--blue)}

/* plots */
.plots{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.plot{border:1px solid var(--line);border-radius:12px;background:#fbf8f1;padding:8px}
.plot h4{margin:0;text-align:center}
.plot svg{width:100%;height:auto;max-height:230px;display:block}
.plot label{display:block;font-size:13px;color:var(--muted);margin-top:4px}
.plot select{width:100%;font-size:14.5px;padding:4px;border-radius:7px;border:1px solid var(--line);background:#fff}
.pres{text-align:center;font-weight:700;font-size:15px;min-height:24px}
.mission{border-left:6px solid var(--sun)}
@keyframes grow{from{transform:scaleY(.05)}to{transform:scaleY(1)}}
.growing{animation:grow 1.2s ease-out}
.report td,.report th{border:1px solid var(--line);padding:7px 12px;text-align:left;background:#fff}
.report{border-collapse:collapse;margin:10px 0;width:100%;max-width:560px}

@media (max-width:820px){
  .plots{grid-template-columns:repeat(2,1fr)}
  .lab{grid-template-columns:1fr}
  .brow{grid-template-columns:110px 1fr 60px}
  h1{font-size:26px}
}
</style>
</head>
<body>
<div class="bar"><div class="brand"><span aria-hidden="true">🌱</span> Carbon Garden</div><div class="who" id="who"></div></div>
<main id="main"></main>

<script>
"use strict";
/* =====================================================================
   TEACHER SETUP
   Paste your Google Apps Script web app URL between the quotes below.
   If you leave it empty, the game still works. Scores just won't be sent.
   ===================================================================== */
const SHEET_URL = "https://script.google.com/macros/s/AKfycbydo067MQWrVTH-rGt0_Dvu6ZJ9a-J5bDZfUi202gGLxwNaZGPsUXelZ3L_jisVVOsW/exec";
/* ===================================================================== */

const SAVE_KEY = "carbonGarden.v1";
const NS = "http://www.w3.org/2000/svg";
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const sleep = ms => new Promise(r => setTimeout(r, ms));
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pick = a => a[Math.floor(Math.random() * a.length)];

/* ---------------- state ---------------- */
let S = null;
function blank(name, period) { return { name, period, sid: Math.random().toString(36).slice(2, 8), stages: {} }; }
function load() { try { const r = localStorage.getItem(SAVE_KEY); return r ? JSON.parse(r) : null; } catch (e) { return null; } }
function save() { try { if (S) localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) {} }
function totals() { let pts = 0, max = 0; for (const s of STAGES) { const r = S.stages[s.id]; if (r) { pts += r.pts; max += r.max; } } return { pts, max }; }
function updateBar() {
  if (!S) { $("#who").innerHTML = ""; return; }
  const t = totals();
  $("#who").innerHTML = `<span class="pill">${esc(S.name)}</span><span class="pill">Period ${esc(S.period)}</span><span class="pill">☀ ${t.pts} sugar points</span>`;
}

/* ---------------- score sheet ---------------- */
function sendRow(stage, score, max) {
  if (!SHEET_URL) return;
  try {
    const t = totals();
    const data = { name: S.name, period: S.period, stage, score, max, total: t.pts, totalMax: t.max, device: S.sid };
    const nm = "sink" + Date.now() + Math.floor(Math.random() * 1000);
    const ifr = document.createElement("iframe");
    ifr.name = nm; ifr.style.display = "none"; document.body.appendChild(ifr);
    const f = document.createElement("form");
    f.method = "POST"; f.action = SHEET_URL; f.target = nm; f.style.display = "none";
    for (const k in data) { const i = document.createElement("input"); i.type = "hidden"; i.name = k; i.value = data[k]; f.appendChild(i); }
    document.body.appendChild(f); f.submit();
    setTimeout(() => { f.remove(); ifr.remove(); }, 20000);
  } catch (e) {}
}

/* ---------------- molecule drawings ---------------- */
const AC = { C: "#333333", O: "#d9473a", H: "#ffffff" };
const NAMES = { C: "Carbon", H: "Hydrogen", O: "Oxygen" };
function A(x, y, e, r, tag) { return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r}" fill="${AC[e]}" stroke="${tag ? "#e59a00" : "#333"}" stroke-width="${tag ? 3.2 : 1.2}"/>`; }
function B(x1, y1, x2, y2) { return `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="#666" stroke-width="2.5"/>`; }
function mol(k, tag = "") {
  const t = e => tag === e;
  if (k === "CO2") return `<svg class="mol" viewBox="0 0 58 26" width="54" height="24" aria-label="CO2">${B(13, 13, 45, 13)}${A(13, 13, "O", 8, t("O"))}${A(29, 13, "C", 8)}${A(45, 13, "O", 8, t("O"))}</svg>`;
  if (k === "H2O") return `<svg class="mol" viewBox="0 0 46 34" width="42" height="31" aria-label="H2O">${B(23, 13, 10, 25)}${B(23, 13, 36, 25)}${A(23, 13, "O", 9, t("O"))}${A(10, 25, "H", 6)}${A(36, 25, "H", 6)}</svg>`;
  if (k === "O2") return `<svg class="mol" viewBox="0 0 42 26" width="38" height="24" aria-label="O2">${B(13, 13, 29, 13)}${A(13, 13, "O", 8, t("O"))}${A(29, 13, "O", 8, t("O"))}</svg>`;
  if (k === "GLU") return gluSVG(t("O"));
  return "";
}
function gluSVG(tagO) {
  const cx = 56, cy = 56, R = 17;
  const P = (r, deg) => [cx + r * Math.cos(deg * Math.PI / 180), cy + r * Math.sin(deg * Math.PI / 180)];
  let bonds = "", atoms = "";
  const ring = []; for (let k = 0; k < 6; k++) ring.push(P(R, -90 + 60 * k));
  for (let k = 0; k < 6; k++) { const a = ring[k], b = ring[(k + 1) % 6]; bonds += B(a[0], a[1], b[0], b[1]); }
  const hs = [];
  for (let k = 1; k <= 5; k++) {
    const ang = -90 + 60 * k;
    hs.push(P(R + 11, ang + 24));
    if (k < 5) {
      const o = P(R + 14, ang - 14); bonds += B(ring[k][0], ring[k][1], o[0], o[1]);
      atoms += A(o[0], o[1], "O", 6, tagO); hs.push(P(R + 22, ang - 24));
    } else {
      const c6 = P(R + 15, ang - 6); bonds += B(ring[k][0], ring[k][1], c6[0], c6[1]);
      const o6 = P(R + 29, ang - 16); bonds += B(c6[0], c6[1], o6[0], o6[1]);
      atoms += A(c6[0], c6[1], "C", 7) + A(o6[0], o6[1], "O", 6, tagO);
      hs.push(P(R + 18, ang + 12), P(R + 24, ang + 2), P(R + 37, ang - 22));
    }
  }
  ring.forEach((p, k) => { atoms += k === 0 ? A(p[0], p[1], "O", 7, tagO) : A(p[0], p[1], "C", 7); });
  hs.forEach(p => { atoms += A(p[0], p[1], "H", 3.6); });
  return `<svg class="mol" viewBox="0 0 112 112" width="66" height="66" aria-label="glucose">${bonds}${atoms}</svg>`;
}
const LEGEND = `<div class="legend"><span><i class="ld" style="background:${AC.C}"></i>Carbon (C)</span><span><i class="ld" style="background:${AC.O}"></i>Oxygen (O)</span><span><i class="ld" style="background:${AC.H}"></i>Hydrogen (H)</span></div>`;
const ATOMS = { CO2: { C: 1, O: 2 }, H2O: { H: 2, O: 1 }, GLU: { C: 6, H: 12, O: 6 }, O2: { O: 2 } };
const LAB = { CO2: "CO₂", H2O: "H₂O", GLU: "C₆H₁₂O₆", O2: "O₂" };

/* ---------------- generic UI pieces ---------------- */
const SPROUT = `<svg viewBox="0 0 40 40" width="38" height="38" aria-hidden="true"><path d="M20 36 V18" stroke="#2a6834" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M20 23 C10 23 6 15 7 9 C14 9 20 14 20 23Z" fill="#3d8b4a"/><path d="M20 20 C28 20 33 13 33 7 C26 7 20 11 20 20Z" fill="#62b05c"/><ellipse cx="20" cy="36" rx="9" ry="3" fill="#8b5d3d"/></svg>`;
function guide(html) { return `<div class="guide"><div class="ava">${SPROUT}</div><div class="bubble">${html}</div></div>`; }
function addHTML(box, html) { const d = document.createElement("div"); d.innerHTML = html; box.appendChild(d); return d; }
function scrollIn(el) { setTimeout(() => { if (el.isConnected) el.scrollIntoView({ behavior: "smooth", block: "nearest" }); }, 40); }
function waitBtn(box, label = "Next →") {
  return new Promise(res => {
    const d = addHTML(box, `<div class="row end"><button class="btn">${label}</button></div>`);
    const b = $("button", d); scrollIn(d);
    b.onclick = () => { d.remove(); res(); };
  });
}
function shakeEl(el) { el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake"); }
function sum(arr) { return arr.reduce((a, r) => ({ pts: a.pts + r.pts, max: a.max + r.max }), { pts: 0, max: 0 }); }

/* multiple choice: full points first try, half on second, then reveal */
function mcq(box, q) {
  const pts = q.pts ?? 10;
  return new Promise(res => {
    const order = q.keep ? q.opts.map((_, i) => i) : shuffle(q.opts.map((_, i) => i));
    const txt = o => typeof o === "string" ? o : o.t;
    const d = addHTML(box, `<div class="card q">${q.label ? `<div class="tag">${q.label}</div>` : ""}<p class="qtext">${q.q}</p>${q.extra || ""}<div class="opts">${order.map(i => `<button class="opt" data-i="${i}">${txt(q.opts[i])}</button>`).join("")}</div><div class="fbwrap"></div></div>`);
    scrollIn(d);
    let tries = 0, over = false;
    const fbw = $(".fbwrap", d);
    $$(".opt", d).forEach(b => b.onclick = () => {
      if (over) return;
      const i = +b.dataset.i; tries++;
      if (i === q.ans) {
        over = true; b.classList.add("right");
        const got = tries === 1 ? pts : tries === 2 ? Math.ceil(pts / 2) : 0;
        $$(".opt", d).forEach(x => x.disabled = true);
        fbw.innerHTML = `<div class="fb good"><b>${tries === 1 ? pick(["Nice!", "Exactly.", "Yes!", "Spot on."]) : "Got it."}</b> ${q.why || ""}<span class="pts">+${got}</span></div>`;
        waitBtn(d, "Continue →").then(() => res({ pts: got, max: pts }));
      } else {
        b.classList.add("wrong"); b.disabled = true;
        const o = q.opts[i], ofb = typeof o === "object" && o.fb ? o.fb : "";
        if (tries >= 2) {
          over = true;
          $$(".opt", d).forEach(x => { x.disabled = true; if (+x.dataset.i === q.ans) x.classList.add("right"); });
          fbw.innerHTML = `<div class="fb bad">${ofb ? ofb + " " : ""}The right answer is highlighted. ${q.why || ""}</div>`;
          waitBtn(d, "Continue →").then(() => res({ pts: 0, max: pts }));
        } else {
          fbw.innerHTML = `<div class="fb bad">${ofb || "Not quite."} Try once more.</div>`;
        }
      }
    });
  });
}
function predict(box, { q, opts }) {
  return new Promise(res => {
    const d = addHTML(box, `<div class="card q"><div class="tag">Prediction: no points, just your best guess</div><p class="qtext">${q}</p><div class="opts">${opts.map((o, i) => `<button class="opt" data-i="${i}">${o}</button>`).join("")}</div></div>`);
    scrollIn(d);
    $$(".opt", d).forEach(b => b.onclick = () => {
      $$(".opt", d).forEach(x => x.disabled = true); b.classList.add("chosen");
      waitBtn(d.firstChild, "Let's find out →").then(() => res(+b.dataset.i));
    });
  });
}
async function quizSeq(box, qs) { const out = []; for (const q of qs) out.push(await mcq(box, q)); return sum(out); }

/* sort items into bins */
function sortTask(box, cfg) {
  return new Promise(res => {
    const n = cfg.items.length, max = n * 2; let pts = 0, placed = 0, sel = null;
    const miss = new Array(n).fill(0);
    const d = addHTML(box, `<div class="card"><p class="qtext">${cfg.q}</p><div class="tray">${shuffle(cfg.items.map((_, i) => i)).map(i => `<button class="chip" data-i="${i}">${cfg.items[i].t}</button>`).join("")}</div><div class="bins">${cfg.bins.map(b => `<div class="bin" data-b="${b.id}" tabindex="0" role="button"><div class="binh">${b.label}</div>${b.sub ? `<div class="binsub">${b.sub}</div>` : ""}<div class="binbody"></div></div>`).join("")}</div><div class="fbwrap"></div></div>`);
    const fb = $(".fbwrap", d);
    scrollIn(d);
    $$(".chip", d).forEach(c => c.onclick = e => {
      e.stopPropagation();
      if (c.classList.contains("placed")) return;
      $$(".chip", d).forEach(x => x.classList.remove("sel"));
      c.classList.add("sel"); sel = +c.dataset.i;
      $$(".bin", d).forEach(b => b.classList.add("ready"));
    });
    const binLabel = id => cfg.bins.find(b => b.id === id).label;
    function place(chip, bin, it, got, ok) {
      pts += got; chip.classList.remove("sel"); chip.classList.add("placed"); if (!ok) chip.classList.add("late");
      $(".binbody", bin).appendChild(chip); placed++; sel = null;
      $$(".bin", d).forEach(b => b.classList.remove("ready"));
      fb.innerHTML = `<div class="fb ${ok ? "good" : "bad"}">${ok ? "<b>Yes!</b> " : `<b>That one goes in "${binLabel(it.bin)}".</b> `}${it.why}</div>`;
      if (placed === n) {
        fb.innerHTML += `<div class="fb info">All sorted! You earned <b>${pts} of ${max}</b> points.</div>`;
        waitBtn(d.firstChild).then(() => res({ pts, max }));
      }
    }
    function drop(bin) {
      if (sel === null) { fb.innerHTML = `<div class="fb info">First tap an item, then tap a bin.</div>`; return; }
      const it = cfg.items[sel], chip = $(`.chip[data-i="${sel}"]`, d);
      if (bin.dataset.b === it.bin) place(chip, bin, it, miss[sel] === 0 ? 2 : miss[sel] === 1 ? 1 : 0, true);
      else {
        miss[sel]++; shakeEl(bin);
        if (miss[sel] >= 2) place(chip, $(`.bin[data-b="${it.bin}"]`, d), it, 0, false);
        else fb.innerHTML = `<div class="fb bad">${it.hint || "Not that bin."} Try another bin.</div>`;
      }
    }
    $$(".bin", d).forEach(b => { b.onclick = () => drop(b); b.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); drop(b); } }; });
  });
}

/* put steps in order */
function orderTask(box, cfg) {
  return new Promise(res => {
    const n = cfg.items.length, max = n * 2; let pts = 0, step = 0, miss = 0;
    const d = addHTML(box, `<div class="card"><p class="qtext">${cfg.q}</p><ol class="slots">${cfg.items.map((_, i) => `<li class="slot" data-s="${i}"><span class="sn">${i + 1}</span><span class="st muted">?</span></li>`).join("")}</ol><p class="muted small">Tap the step that comes next:</p><div class="tray">${shuffle(cfg.items.map((_, i) => i)).map(i => `<button class="chip" data-i="${i}">${cfg.items[i].t}</button>`).join("")}</div><div class="fbwrap"></div></div>`);
    scrollIn(d);
    const fb = $(".fbwrap", d);
    function handle(c) {
      const i = +c.dataset.i;
      if (i === step) {
        const got = miss === 0 ? 2 : miss === 1 ? 1 : 0; pts += got;
        const slot = $(`.slot[data-s="${i}"]`, d); slot.classList.add("filled");
        const st = $(".st", slot); st.textContent = cfg.items[i].t; st.classList.remove("muted");
        c.remove(); step++; miss = 0;
        fb.innerHTML = `<div class="fb good">${cfg.items[i].why || "Yes!"}</div>`;
        if (step === n) { fb.innerHTML += `<div class="fb info">Chain complete! <b>${pts} of ${max}</b> points.</div>`; waitBtn(d.firstChild).then(() => res({ pts, max })); }
      } else {
        miss++; shakeEl(c);
        if (miss >= 3) { fb.innerHTML = ""; handle($(`.chip[data-i="${step}"]`, d)); return; }
        fb.innerHTML = `<div class="fb bad">Not yet. ${cfg.items[step].hint}</div>`;
      }
    }
    $$(".chip", d).forEach(c => c.onclick = () => handle(c));
  });
}

/* count atoms in the unbalanced equation */
function eqStatic(keys, arrowNote, extraRight) {
  const term = k => `<div class="term"><div class="pics">${mol(k)}</div><div class="flab">${LAB[k]}</div></div>`;
  const [l, r] = keys;
  return `<div class="eq">${l.map(term).join('<div class="plus">+</div>')}<div class="arrow">→${arrowNote ? `<small>${arrowNote}</small>` : ""}</div>${r.map(term).join('<div class="plus">+</div>')}${extraRight ? `<div class="plus">+</div><div class="energy">${extraRight}</div>` : ""}</div>`;
}
function atomAudit(box) {
  addHTML(box, guide(`Scientists write this reaction with <b>chemical formulas</b>. Each capital letter is a kind of atom, and the small number after it tells how many. So <b>CO₂</b> is 1 carbon + 2 oxygen, and <b>H₂O</b> is 2 hydrogen + 1 oxygen.`));
  addHTML(box, `<div class="card">${LEGEND}${eqStatic([["CO2", "H2O"], ["GLU", "O2"]], "light energy")}</div>`);
  return new Promise(res => {
    const ans = { LC: 1, LH: 2, LO: 3, RC: 6, RH: 12, RO: 8 };
    const d = addHTML(box, `<div class="card"><p class="qtext">Count the atoms on each side. (There is just one of each molecule.)</p>
      <table class="tally audit"><tr><th></th><th>Left side<br><span class="small muted">CO₂ + H₂O</span></th><th>Right side<br><span class="small muted">C₆H₁₂O₆ + O₂</span></th></tr>
      ${["C", "H", "O"].map(e => `<tr><th>${NAMES[e]} (${e})</th><td><input inputmode="numeric" maxlength="2" data-k="L${e}" aria-label="${NAMES[e]} left"></td><td><input inputmode="numeric" maxlength="2" data-k="R${e}" aria-label="${NAMES[e]} right"></td></tr>`).join("")}</table>
      <div class="row end"><button class="btn" id="chk">Check my counts</button></div><div class="fbwrap"></div></div>`);
    scrollIn(d);
    let first = true, pts = 0;
    $("#chk", d).onclick = () => {
      const inputs = $$("input", d), fb = $(".fbwrap", d);
      if (inputs.some(i => i.value.trim() === "")) { fb.innerHTML = `<div class="fb info">Fill in all six boxes first.</div>`; return; }
      let all = true;
      inputs.forEach(inp => { const ok = +inp.value === ans[inp.dataset.k]; inp.classList.toggle("good", ok); inp.classList.toggle("bad", !ok); if (!ok) all = false; if (ok && first) pts += 2; });
      first = false;
      if (!all) { fb.innerHTML = `<div class="fb bad">Some counts are off (red boxes). Tip: the oxygen on the right is in TWO places, inside the sugar AND in O₂. Add them together.</div>`; return; }
      $("#chk", d).disabled = true; inputs.forEach(i => i.disabled = true);
      fb.innerHTML = `<div class="fb good"><b>Counted!</b> <span class="pts">+${pts}</span><br>Left: 1 C, 2 H, 3 O. Right: 6 C, 12 H, 8 O. <b>They don't match!</b> But atoms can't appear out of nowhere or vanish. In a reaction they only get <b>rearranged</b>. So the leaf must use <b>more</b> CO₂ and H₂O molecules than this. Let's figure out how many.</div>`;
      waitBtn(d.firstChild).then(() => res({ pts, max: 12 }));
    };
  });
}

/* balance an equation with steppers */
function balancer(box, cfg) {
  return new Promise(res => {
    const terms = [...cfg.left.map(t => ({ ...t, side: "L" })), ...cfg.right.map(t => ({ ...t, side: "R" }))];
    terms.forEach(t => { t.c = 1; t.atoms = ATOMS[t.k]; });
    let wrong = 0, done = false;
    const d = addHTML(box, `<div class="card"><p class="qtext">${cfg.q}</p>${LEGEND}<div class="eq" id="eqrow"></div><table class="tally" id="tal"></table><div class="row end"><button class="btn" id="bchk">Check balance</button></div><div class="fbwrap"></div></div>`);
    scrollIn(d);
    const count = side => { const c = { C: 0, H: 0, O: 0 }; terms.filter(t => t.side === side).forEach(t => { for (const e in t.atoms) c[e] += t.atoms[e] * t.c; }); return c; };
    function termHTML(t, idx) {
      const pics = Array.from({ length: Math.min(t.c, 8) }, () => mol(t.k)).join("") + (t.c > 8 ? `<b>+${t.c - 8}</b>` : "");
      const st = t.fixed ? `<span class="coef fixed" title="kept at 1">${t.c}</span>` : `<button data-i="${idx}" data-d="-1" aria-label="fewer ${LAB[t.k]}">−</button><span class="coef">${t.c}</span><button data-i="${idx}" data-d="1" aria-label="more ${LAB[t.k]}">+</button>`;
      return `<div class="term"><div class="stepper">${st}</div><div class="pics">${pics}</div><div class="flab">${LAB[t.k]}</div></div>`;
    }
    function render() {
      const L = terms.map((t, i) => [t, i]).filter(([t]) => t.side === "L"), R = terms.map((t, i) => [t, i]).filter(([t]) => t.side === "R");
      $("#eqrow", d).innerHTML = L.map(([t, i]) => termHTML(t, i)).join('<div class="plus">+</div>') + `<div class="arrow">→${cfg.arrowNote ? `<small>${cfg.arrowNote}</small>` : ""}</div>` + R.map(([t, i]) => termHTML(t, i)).join('<div class="plus">+</div>') + (cfg.extraRight ? `<div class="plus">+</div><div class="energy">${cfg.extraRight}</div>` : "");
      const l = count("L"), r = count("R");
      $("#tal", d).innerHTML = `<tr><th>Atom</th><th>Left side</th><th>Right side</th><th></th></tr>` + ["C", "H", "O"].map(e => `<tr><td>${NAMES[e]}</td><td>${l[e]}</td><td>${r[e]}</td><td class="${l[e] === r[e] ? "ok" : "no"}">${l[e] === r[e] ? "equal ✓" : "not equal"}</td></tr>`).join("");
      $$(".stepper button", d).forEach(b => b.onclick = () => { if (done) return; const t = terms[+b.dataset.i]; t.c = Math.max(1, Math.min(12, t.c + +b.dataset.d)); render(); });
    }
    render();
    $("#bchk", d).onclick = () => {
      const l = count("L"), r = count("R"), fb = $(".fbwrap", d);
      const bad = ["C", "H", "O"].filter(e => l[e] !== r[e]);
      if (!bad.length) {
        done = true; $("#bchk", d).disabled = true; $$(".stepper button", d).forEach(b => b.disabled = true);
        const got = Math.max(8, 20 - 4 * wrong);
        fb.innerHTML = `<div class="fb good"><b>Balanced!</b> Every atom on the left shows up on the right. <span class="pts">+${got}</span></div><div class="bigeq">${cfg.final}</div>`;
        waitBtn(d.firstChild).then(() => res({ pts: got, max: 20 }));
      } else {
        wrong++;
        fb.innerHTML = `<div class="fb bad">Not balanced yet: <b>${bad.map(e => NAMES[e].toLowerCase()).join(" and ")}</b> ${bad.length > 1 ? "don't" : "doesn't"} match. ${cfg.hints[Math.min(wrong - 1, cfg.hints.length - 1)]}</div>`;
      }
    };
  });
}

/* ---------------- garden drawing ---------------- */
function leafPath(x, y, len, ang, col) {
  return `<g transform="translate(${x} ${y}) rotate(${ang})"><path d="M0 0 C ${len * .3} ${-len * .28} ${len * .75} ${-len * .25} ${len} 0 C ${len * .75} ${len * .25} ${len * .3} ${len * .28} 0 0Z" fill="${col}" stroke="#2a6834" stroke-width="1"/></g>`;
}
function gardenSVG(l) {
  const skies = ["#d6ecf8", "#d6ecf8", "#cfe5f6", "#d9edf5", "#e2f0f2", "#f2ead4", "#f5e4c6", "#f3dab7"];
  const H = [0, 28, 66, 100, 128, 146, 156, 160][l];
  const nL = [0, 2, 4, 6, 8, 10, 12, 12][l];
  const gx = 300, gy = 212;
  let s = `<svg viewBox="0 0 600 260" class="gsvg" role="img" aria-label="Your garden plot"><rect width="600" height="260" fill="${skies[l]}"/>`;
  s += `<g fill="#f6c443"><circle cx="530" cy="52" r="24"/>${[0, 45, 90, 135, 180, 225, 270, 315].map(a => { const r = a * Math.PI / 180; return `<line x1="${530 + 30 * Math.cos(r)}" y1="${52 + 30 * Math.sin(r)}" x2="${530 + 40 * Math.cos(r)}" y2="${52 + 40 * Math.sin(r)}" stroke="#f6c443" stroke-width="4" stroke-linecap="round"/>`; }).join("")}</g>`;
  s += `<path d="M0 150 Q 150 120 300 150 T 600 145 V260 H0Z" fill="#b9d89a" opacity=".6"/>`;
  s += `<g stroke="#a98458" stroke-width="5">${[30, 90, 150, 450, 510, 570].map(x => `<line x1="${x}" y1="${gy}" x2="${x}" y2="${gy - 45}"/>`).join("")}<line x1="20" y1="${gy - 32}" x2="160" y2="${gy - 32}"/><line x1="440" y1="${gy - 32}" x2="580" y2="${gy - 32}"/></g>`;
  s += `<rect y="${gy}" width="600" height="${260 - gy}" fill="#8b5d3d"/><rect y="${gy}" width="600" height="7" fill="#6f9e4f"/>`;
  if (l === 0) s += `<ellipse cx="${gx}" cy="${gy + 24}" rx="10" ry="6.5" fill="#d9c08a" stroke="#7a5a2a" stroke-width="1.5"/><path d="M${gx} ${gy + 30} q 3 8 -2 14" stroke="#e8dcc0" stroke-width="2" fill="none"/>`;
  if (l >= 1) {
    const rd = Math.min(36, 10 + l * 5);
    s += `<g stroke="#e8dcc0" stroke-width="2" fill="none"><path d="M${gx} ${gy} q -4 ${rd * .5} -14 ${rd}"/><path d="M${gx} ${gy} q 3 ${rd * .6} 12 ${rd * .9}"/><path d="M${gx} ${gy} q 0 ${rd * .6} -2 ${rd * 1.1}"/></g>`;
    s += `<path d="M${gx} ${gy} C ${gx - 5} ${gy - H * .4} ${gx + 5} ${gy - H * .7} ${gx} ${gy - H}" stroke="#2f7a3a" stroke-width="${3 + l * .6}" fill="none" stroke-linecap="round"/>`;
    if (l === 1) s += leafPath(gx, gy - H, 20, -150, "#7cc46f") + leafPath(gx, gy - H, 20, -30, "#7cc46f");
    for (let i = 0; i < nL && l > 1; i++) {
      const y = gy - H * (0.22 + 0.72 * (i / Math.max(nL - 1, 1)));
      const right = i % 2 === 0;
      s += leafPath(gx, y, 30 + (l * 2) - i, right ? -25 - (i % 3) * 6 : -155 + (i % 3) * 6, i % 3 === 0 ? "#4f9e4f" : "#62b05c");
    }
    if (l >= 2) s += leafPath(gx, gy - H, 22, -100, "#7cc46f") + leafPath(gx, gy - H, 22, -80, "#62b05c");
    if (l >= 4) [0.45, 0.65, 0.85].forEach((f, k) => { const x = gx + (k % 2 ? -26 : 26), y = gy - H * f; s += `<g><circle cx="${x}" cy="${y}" r="5" fill="#fff" stroke="#b07cc6" stroke-width="2"/><circle cx="${x}" cy="${y}" r="2" fill="#f0b429"/></g>`; });
    if (l >= 5) { const np = l === 5 ? 4 : 8; for (let k = 0; k < np; k++) { const f = 0.3 + 0.6 * (k / np), x = gx + (k % 2 ? -14 : 14), y = gy - H * f; s += `<path d="M${x} ${y} q ${k % 2 ? -4 : 4} 16 ${k % 2 ? -2 : 2} 30" stroke="#3c8a3c" stroke-width="5" fill="none" stroke-linecap="round"/>`; } }
    if (l >= 5) [100, 190, 500, 560].slice(0, l === 5 ? 2 : 4).forEach(x => { s += `<path d="M${x} ${gy} v -14" stroke="#2f7a3a" stroke-width="2.5"/>${leafPath(x, gy - 14, 11, -150, "#7cc46f")}${leafPath(x, gy - 14, 11, -30, "#7cc46f")}`; });
    if (l >= 7) s += `<g transform="translate(385 ${gy - 30})"><path d="M0 0 h70 l-8 32 h-54z" fill="#b5823f" stroke="#7a5426" stroke-width="2"/><path d="M8 8 h54 M6 18 h58" stroke="#7a5426" stroke-width="1.5"/>${[10, 22, 34, 46, 58].map(x => `<path d="M${x} 2 q 4 -12 10 -16" stroke="#3c8a3c" stroke-width="5" stroke-linecap="round" fill="none"/>`).join("")}</g>`;
  }
  return s + "</svg>";
}

function cycleSVG(done) {

  s += `<text x="320" y="146" text-anchor="middle" font-size="17" font-weight="800" fill="#2a6834">Matter cycles</text><text x="320" y="166" text-anchor="middle" font-size="13" fill="#6c6457">follow one carbon atom</text>`;
  for (let k = 0; k < 6; k++) {

const PF = { light: { shade: .3, part: .65, full: 1 }, water: { low: .45, med: 1, high: .8, flood: .25 }, fert: { none: .75, compost: 1 }, space: { crowded: .55, spread: 1 } };

function growPlot(p) {

}

  if (p.light === "full") s += `<circle cx="180" cy="18" r="12" fill="#f6c443"/>`;
  if (p.light === "part") s += `<circle cx="180" cy="18" r="11" fill="#f6c443" opacity=".55"/><ellipse cx="170" cy="21" rx="18" ry="8" fill="#fff"/>`;
  s += `<rect y="${gy}" width="200" height="14" fill="${p.fert === "compost" ? "#5c3c26" : "#8b5d3d"}"/>`;
  if (p.water === "flood") s += `<rect y="${gy - 6}" width="200" height="10" fill="#6aaad8" opacity=".8"/>`;
  s += `<g transform="translate(40 0)">`;
  if (p.water === "low") s += `<path d="M10 ${gy + 6} l8 4 l6 -3 M70 ${gy + 8} l10 3 l5 -4" stroke="#5a3a20" fill="none"/>`;
  if (!p.res) {
    s += `<path d="M60 ${gy} v -10" stroke="#2f7a3a" stroke-width="2.5"/>${leafPath(60, gy - 10, 9, -150, "#7cc46f")}${leafPath(60, gy - 10, 9, -30, "#7cc46f")}`;
  } else {
    const H = Math.min(158, p.res.h * 1.35), nl = Math.max(2, Math.round(p.res.h / 11)), np = Math.round(p.res.b / 9);
    s += `<g class="${anim ? "growing" : ""}" style="transform-box:view-box;transform-origin:60px ${gy}px">`;
    s += `<path d="M60 ${gy} C 57 ${gy - H * .4} 63 ${gy - H * .7} 60 ${gy - H}" stroke="#2f7a3a" stroke-width="${p.v === "giant" ? 3.5 : 2.5}" fill="none"/>`;
    for (let i = 0; i < nl; i++) { const y = gy - H * (0.15 + 0.82 * i / Math.max(nl - 1, 1)); s += leafPath(60, y, p.v === "bush" ? 20 : 17, i % 2 ? -150 : -30, i % 3 ? "#62b05c" : "#4f9e4f"); }
    for (let k = 0; k < np; k++) { const y = gy - H * (0.2 + 0.6 * ((k * 0.37) % 1)), x = 60 + (k % 2 ? -8 : 8); s += `<path d="M${x} ${y} q ${k % 2 ? -3 : 3} 7 ${k % 2 ? -1 : 1} 13" stroke="#3c8a3c" stroke-width="3.2" fill="none" stroke-linecap="round"/>`; }
    s += `</g>`;
  }

  return s + "</g></svg>";
}

    const r = await parts[i]($("#stageBox"));
    if (token !== RUN) return;
    if (practice) { pp += r.pts; pm += r.max; }
    else { rec.pts += r.pts; rec.max += r.max; rec.part = i + 1; save(); updateBar(); }
  }
  if (token !== RUN) return;
  if (!practice) {
    rec.done = true; rec.when = new Date().toISOString(); save(); updateBar();
    sendRow(`${st.n}. ${st.title}`, rec.pts, rec.max);
    if (st.id === "final") { const t = totals(); setTimeout(() => sendRow("FINAL TOTAL", t.pts, t.max), 1500); }
  }
  if (st.id === "final" && !practice) showReport();
  else stageDone(st, practice ? { pts: pp, max: pm } : rec, practice);
}
function stageDone(st, r, practice) {
  const done = STAGES.filter(s => S.stages[s.id] && S.stages[s.id].done).length;
  $("#main").innerHTML = `<div class="card center"><h1>${practice ? "Practice complete" : "Season complete!"}</h1><p style="font-size:20px">${st.icon} <b>${st.title}</b>: ${r.pts} / ${r.max} sugar points</p>
    ${practice ? `<p class="muted">Practice scores aren't recorded. Your first score is the one that counts.</p>` : `<p class="muted">Saved on this computer.${SHEET_URL ? " Sent to your teacher's score sheet." : ""}</p>`}
    ${gardenSVG(done)}<p class="gcap">${CAPTIONS[done]}</p><div class="row" style="justify-content:center;margin-top:10px"><button class="btn" id="back">Back to my garden →</button></div></div>`;
  $("#back").onclick = showHub; window.scrollTo(0, 0);
}
function showReport() {
  RUN++;
  const t = totals(); const pct = t.max ? Math.round(100 * t.pts / t.max) : 0;
  const rows = STAGES.map(s => { const r = S.stages[s.id]; return `<tr><td>${s.icon} ${s.title}</td><td>${r && r.done ? `${r.pts} / ${r.max}` : "not finished"}</td></tr>`; }).join("");
  const when = new Date().toLocaleString();
  $("#main").innerHTML = `<div class="card"><h1>🧺 Harvest Report</h1><p style="font-size:19px"><b>${esc(S.name)}</b> · Period ${esc(S.period)} · ${esc(when)}</p>
    ${gardenSVG(7)}
    <table class="report"><tr><th>Season</th><th>Score</th></tr>${rows}<tr><th>Total</th><th>${t.pts} / ${t.max} (${pct}%)</th></tr></table>
    <p class="muted">${SHEET_URL ? "Your scores were sent to your teacher's score sheet. " : ""}If your teacher asks, take a screenshot of this page.</p>
    <div class="row"><button class="btn" id="back">Back to my garden</button>${SHEET_URL ? `<button class="btn alt" id="resend">Send my final score again</button>` : ""}</div></div>`;
  $("#back").onclick = showHub;
  if (SHEET_URL) $("#resend").onclick = e => { sendRow("FINAL TOTAL (resent)", t.pts, t.max); e.target.disabled = true; e.target.textContent = "Sent!"; };
  window.scrollTo(0, 0);
}

/* ---------------- start ---------------- */
showTitle();
</script>
